<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERVA THRIFT STORE</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* KOMBINASI WARNA NO. 1: STREETWEAR RED & DARK */
        :root {
            --primary-red: #dc2626;       /* Merah Cabai Bold */
            --hover-red: #b91c1c;         /* Merah Gelap saat ditekan */
            --bg-body: #f9fafb;           /* Off-White / Soft Grey */
            --card-bg: #ffffff;           /* Putih Bersih Kartu */
            --text-main: #111827;         /* Hitam Pekat Streetwear */
            --text-muted: #6b7280;        /* Abu-abu Teks Sekunder */
            --border-color: #e5e7eb;      /* Garis Batas Halus */
            --font-brand: 'Unbounded', sans-serif;
            --font-main: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* Header Bar Streetwear */
        header {
            background-color: var(--card-bg);
            padding: 16px 20px;
            border-bottom: 2px solid var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-brand);
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
        }

        .logo span {
            color: var(--primary-red);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-red);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .container {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* Form Admin Upload */
        .admin-card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: 14px;
            border: 2px solid var(--text-main);
            margin-bottom: 28px;
            box-shadow: 4px 4px 0px var(--text-main);
            display: none;
        }

        .admin-card h3 {
            font-family: var(--font-brand);
            margin-bottom: 16px;
            font-size: 0.95rem;
            color: var(--primary-red);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            background: #fff;
            transition: 0.2s;
            font-family: var(--font-main);
            color: var(--text-main);
        }

        input:focus, select:focus {
            border-color: var(--primary-red);
        }

        .guide-text {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: -4px;
            line-height: 1.4;
        }

        .guide-text a {
            color: var(--primary-red);
            text-decoration: underline;
            font-weight: 700;
        }

        /* Button Action */
        .btn-upload {
            width: 100%;
            background: var(--primary-red);
            color: white;
            border: 2px solid var(--text-main);
            padding: 13px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s;
            font-family: var(--font-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 2px 2px 0px var(--text-main);
        }

        .btn-upload:active {
            transform: translate(2px, 2px);
            box-shadow: none;
            background: var(--hover-red);
        }

        /* Section Title Streetwear */
        .section-title {
            font-family: var(--font-brand);
            font-size: 1.05rem;
            font-weight: 900;
            margin-bottom: 18px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: -0.3px;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Grid Katalog Produk */
        .katalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        @media (min-width: 640px) {
            .katalog-grid {
                grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
                gap: 20px;
            }
        }

        /* Card Produk Streetwear Style */
        .product-card {
            background: var(--card-bg);
            border: 2px solid var(--text-main);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
            position: relative;
            box-shadow: 3px 3px 0px var(--text-main);
        }

        .product-card:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--text-main);
        }

        .img-container {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #f3f4f6;
            overflow: hidden;
            border-bottom: 2px solid var(--text-main);
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        .product-card.sold .product-img {
            filter: grayscale(100%) opacity(0.5);
        }

        .badge-status {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1.5px solid var(--text-main);
        }

        .badge-available {
            background: #16a34a;
            color: white;
        }

        .badge-sold {
            background: var(--text-main);
            color: white;
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: var(--text-main);
            line-height: 1.3;
        }

        .product-price {
            font-weight: 800;
            color: var(--primary-red);
            font-size: 1.05rem;
            margin-bottom: 12px;
        }

        .product-card.sold .product-price {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .btn-wa {
            background: var(--primary-red);
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: 700;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: auto;
            border: 1.5px solid var(--text-main);
            transition: transform 0.1s ease, background 0.2s;
            font-family: var(--font-main);
        }

        .btn-wa:active {
            transform: scale(0.96);
        }

        .btn-wa.disabled {
            background: #9ca3af;
            color: #4b5563;
            cursor: not-allowed;
            pointer-events: none;
            border-color: #9ca3af;
        }

        /* Admin Action Buttons */
        .admin-controls {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
        }

        .btn-edit {
            background: #2563eb;
            color: white;
            border: 1px solid var(--text-main);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .btn-delete {
            background: var(--text-main);
            color: white;
            border: 1px solid var(--text-main);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
        }

        /* Modal Edit Pop-up */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 20px;
            border-radius: 14px;
            border: 2px solid var(--text-main);
            box-shadow: 6px 6px 0px var(--text-main);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h4 {
            font-family: var(--font-brand);
            font-size: 0.95rem;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .btn-close-modal {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-save {
            flex: 1;
            background: #2563eb;
            color: white;
            border: 1.5px solid var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background: #e5e7eb;
            color: var(--text-main);
            border: 1.5px solid var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header dengan Trik Ketuk 5x Logo untuk Admin -->
    <header>
        <div class="logo" id="logo-btn">
            <div class="logo-icon">
                <i class="fa-solid fa-shirt"></i>
            </div>
            <span>ZERVA <span>THRIFT</span></span>
        </div>
    </header>

    <div class="container">
        <!-- Form Upload Produk Khusus Admin -->
        <div class="admin-card" id="admin-card">
            <h3><i class="fa-solid fa-plus-circle"></i> Upload Barang Baru</h3>
            <div class="form-group">
                <input type="text" id="nama-produk" placeholder="Nama Produk (contoh: Outerwear Nike Zip)" />
                <input type="number" id="harga-produk" placeholder="Harga (contoh: 85000)" />
                <select id="status-produk">
                    <option value="ready">Status: Tersedia (Ready)</option>
                    <option value="sold">Status: SOLD OUT</option>
                </select>
                <input type="url" id="link-foto-produk" placeholder="Direct Link Foto (contoh: https://i.ibb.co/xxxx/nike.jpg)" />
                <p class="guide-text">
                    * Buka <a href="https://imgbb.com" target="_blank">imgbb.com</a> -> Upload Foto -> Tahan/klik kanan fotonya -> pilih <b>"Copy Image Address"</b> lalu paste link-nya di atas.
                </p>
            </div>
            <button class="btn-upload" id="btn-submit-upload" onclick="playClickSound(); tambahProduk()">Upload ke Katalog</button>
        </div>

        <!-- Section Katalog -->
        <div class="section-title">
            <i class="fa-solid fa-fire-flame-curved" style="color: var(--primary-red);"></i> Katalog Produk
        </div>
        
        <div id="loading" class="loading-state">
            <i class="fa-solid fa-spinner fa-spin"></i> Memuat katalog produk...
        </div>
        
        <div class="katalog-grid" id="katalog-grid"></div>
    </div>

    <!-- Modal Edit Pop-up -->
    <div class="modal-overlay" id="modal-edit">
        <div class="modal-content">
            <div class="modal-header">
                <h4><i class="fa-solid fa-pen-to-square"></i> Edit Detail Produk</h4>
                <button class="btn-close-modal" onclick="tutupModalEdit()">&times;</button>
            </div>
            <input type="hidden" id="edit-id" />
            <div class="form-group">
                <label style="font-size: 0.8rem; font-weight: 700;">Nama Barang:</label>
                <input type="text" id="edit-nama" />
                
                <label style="font-size: 0.8rem; font-weight: 700;">Harga (Rp):</label>
                <input type="number" id="edit-harga" />
                
                <label style="font-size: 0.8rem; font-weight: 700;">Status Barang:</label>
                <select id="edit-status">
                    <option value="ready">Tersedia (Ready)</option>
                    <option value="sold">SOLD OUT</option>
                </select>

                <label style="font-size: 0.8rem; font-weight: 700;">Direct Link Foto:</label>
                <input type="url" id="edit-link-foto" />
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="tutupModalEdit()">Batal</button>
                <button class="btn-save" id="btn-submit-edit" onclick="simpanPerubahanEdit()">Simpan Edit</button>
            </div>
        </div>
    </div>

    <script>
        const NOMOR_WA = "6289509609700";
        const KODE_RAHASIA = "thriftzerva1122";
        
        // Database API Endpoint
        const JSONBIN_BIN_ID = "66f4e195e41b4d34e43813fa";
        const JSONBIN_MASTER_KEY = "$2a$10$w0fLgX569w6C3sL4kL1g..U/.K4Q7E1E/9z3O3S7XlK/P.B1uL43e";
        const API_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

        let produkList = [];

        // Efek Suara Tombol
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(850, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(420, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        // Cek Admin via URL
        const urlParams = new URLSearchParams(window.location.search);
        let isAdmin = urlParams.get('admin') === KODE_RAHASIA;

        document.addEventListener('DOMContentLoaded', () => {
            if (isAdmin) {
                document.getElementById('admin-card').style.display = 'block';
            }
            ambilDataOnline();
        });

        // Ketuk Logo 5x untuk Masuk Mode Admin
        let logoClickCount = 0;
        let logoClickTimer;
        document.getElementById('logo-btn').addEventListener('click', () => {
            playClickSound();
            logoClickCount++;
            clearTimeout(logoClickTimer);

            if (logoClickCount === 5) {
                if (!isAdmin) {
                    const inputPassword = prompt("Masukkan Password Admin ZERVA:");
                    if (inputPassword === KODE_RAHASIA) {
                        isAdmin = true;
                        document.getElementById('admin-card').style.display = 'block';
                        tampilkanSemuaProduk();
                        alert("Mode Admin Aktif!");
                    } else if (inputPassword !== null) {
                        alert("Password Salah!");
                    }
                } else {
                    isAdmin = false;
                    document.getElementById('admin-card').style.display = 'none';
                    tampilkanSemuaProduk();
                    alert("Keluar dari Mode Admin.");
                }
                logoClickCount = 0;
            } else {
                logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 1500);
            }
        });

        // Ambil Data dari Database Online
        async function ambilDataOnline() {
            try {
                const response = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                });
                const data = await response.json();
                produkList = data.record.produk || [];
                document.getElementById('loading').style.display = 'none';
                tampilkanSemuaProduk();
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Gagal memuat katalog. Silakan refresh halaman.';
            }
        }

        // Simpan Data ke Database Online
        async function simpanDataOnline() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memperbarui katalog...';
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_MASTER_KEY
                    },
                    body: JSON.stringify({ produk: produkList })
                });
                document.getElementById('loading').style.display = 'none';
                tampilkanSemuaProduk();
            } catch (error) {
                alert("Gagal menyimpan perubahan ke database.");
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function tambahProduk() {
            const nama = document.getElementById('nama-produk').value.trim();
            const harga = document.getElementById('harga-produk').value.trim();
            const status = document.getElementById('status-produk').value;
            const fotoUrl = document.getElementById('link-foto-produk').value.trim();

            if (!nama || !harga || !fotoUrl) {
                alert('Semua kolom (Nama, Harga, dan Link Foto) wajib diisi!');
                return;
            }

            const produkBaru = {
                id: Date.now(),
                nama: nama,
                harga: harga,
                status: status,
                foto: fotoUrl
            };

            produkList.push(produkBaru);

            // Riset Form Input
            document.getElementById('nama-produk').value = '';
            document.getElementById('harga-produk').value = '';
            document.getElementById('status-produk').value = 'ready';
            document.getElementById('link-foto-produk').value = '';

            await simpanDataOnline();
        }

        function tampilkanSemuaProduk() {
            const katalogGrid = document.getElementById('katalog-grid');
            katalogGrid.innerHTML = '';

            if (produkList.length === 0) {
                katalogGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #9ca3af; padding: 30px; font-weight: 600;">Belum ada barang di katalog.</p>';
                return;
            }

            produkList.forEach(item => {
                const isSold = item.status === 'sold';
                const hargaFormat = Number(item.harga).toLocaleString('id-ID');
                const teksPesan = `Halo min, saya mau order barang thrift ini:%0A- Nama: ${encodeURIComponent(item.nama)}%0A- Harga: Rp ${hargaFormat}`;
                const linkWA = `https://api.whatsapp.com/send?phone=${NOMOR_WA}&text=${teksPesan}`;

                const card = document.createElement('div');
                card.className = `product-card ${isSold ? 'sold' : ''}`;

                const badgeHtml = isSold 
                    ? `<span class="badge-status badge-sold"><i class="fa-solid fa-xmark"></i> SOLD</span>` 
                    : `<span class="badge-status badge-available"><i class="fa-solid fa-check"></i> READY</span>`;

                const tombolWaHtml = isSold
                    ? `<a class="btn-wa disabled"><i class="fa-solid fa-ban"></i> Terjual</a>`
                    : `<a href="${linkWA}" target="_blank" class="btn-wa" onclick="playClickSound()"><i class="fa-brands fa-whatsapp"></i> Beli via WA</a>`;

                const adminControlsHtml = isAdmin ? `
                    <div class="admin-controls">
                        <button class="btn-edit" onclick="playClickSound(); bukaModalEdit(${item.id})">
                            <i class="fa-solid fa-pen-to-square"></i> Edit
                        </button>
                        <button class="btn-delete" onclick="playClickSound(); hapusProduk(${item.id})">
                            <i class="fa-solid fa-trash"></i> Hapus
                        </button>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="img-container">
                        <img src="${item.foto}" alt="${item.nama}" class="product-img" onerror="this.src='https://via.placeholder.com/300x300?text=Gambar+Tidak+Muncul'">
                        ${badgeHtml}
                    </div>
                    <div class="product-info">
                        <div class="product-title">${item.nama}</div>
                        <div class="product-price">Rp ${hargaFormat}</div>
                        ${tombolWaHtml}
                        ${adminControlsHtml}
                    </div>
                `;
                katalogGrid.appendChild(card);
            });
        }

        // Fungsi Edit Popup
        function bukaModalEdit(id) {
            const produk = produkList.find(p => p.id === id);
            if (!produk) return;

            document.getElementById('edit-id').value = produk.id;
            document.getElementById('edit-nama').value = produk.nama;
            document.getElementById('edit-harga').value = produk.harga;
            document.getElementById('edit-status').value = produk.status || 'ready';
            document.getElementById('edit-link-foto').value = produk.foto;

            document.getElementById('modal-edit').style.display = 'flex';
        }

        function tutupModalEdit() {
            document.getElementById('modal-edit').style.display = 'none';
        }

        async function simpanPerubahanEdit() {
            const id = Number(document.getElementById('edit-id').value);
            const namaBaru = document.getElementById('edit-nama').value.trim();
            const hargaBaru = document.getElementById('edit-harga').value.trim();
            const statusBaru = document.getElementById('edit-status').value;
            const fotoBaru = document.getElementById('edit-link-foto').value.trim();

            if (!namaBaru || !hargaBaru || !fotoBaru) {
                alert('Semua bidang wajib diisi!');
                return;
            }

            const index = produkList.findIndex(p => p.id === id);
            if (index === -1) return;

            produkList[index].nama = namaBaru;
            produkList[index].harga = hargaBaru;
            produkList[index].status = statusBaru;
            produkList[index].foto = fotoBaru;

            tutupModalEdit();
            await simpanDataOnline();
        }

        async function hapusProduk(id) {
            if (confirm('Yakin ingin menghapus produk ini dari katalog online?')) {
                produkList = produkList.filter(item => item.id !== id);
                await simpanDataOnline();
            }
        }
    </script>
</body>
</html>
